<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop AI Companion - Lobby</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Noto+Sans+JP:wght@300;400;600;700&display=swap');

    :root {
      --theme-color: #00f0ff;
      --theme-glow: rgba(0, 240, 255, 0.4);
      --bg-color: #090b10;
      --part-scale: 1;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: var(--bg-color);
      color: #e2e8f0;
      overflow-x: hidden;
    }

    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }

    /* ロビーのフェイシャルパーツ共通スタイル */
    .lobby-part {
      background-color: var(--theme-color) !important;
      border-color: var(--theme-color) !important;
      box-shadow: 0 0 15px var(--theme-glow), inset 0 0 10px var(--theme-glow);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center;
    }

    .lobby-part-border {
      border-color: var(--theme-color) !important;
      box-shadow: 0 0 15px var(--theme-glow);
    }

    .lobby-part-svg {
      fill: var(--theme-color) !important;
      stroke: var(--theme-color) !important;
      filter: drop-shadow(0px 0px 8px var(--theme-color));
    }

    /* サイズ調整コンテナ */
    .face-scalable-container {
      transform: scale(var(--part-scale));
      transition: transform 0.3s ease;
    }

    /* アニメーション定義 */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px var(--theme-glow); }
      50% { box-shadow: 0 0 30px var(--theme-color), 0 0 10px var(--theme-color); }
    }

    .pulse-glow {
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    /* 思考中（まばたき/パチパチ）高度アニメーション */
    @keyframes thinkingBlinkFast {
      0%, 100% { transform: scaleY(1); }
      15% { transform: scaleY(0.05); }
      30% { transform: scaleY(1); }
      45% { transform: scaleY(0.05); }
      60% { transform: scaleY(1); }
      85% { transform: scaleY(0.1); }
    }

    .thinking-eyes {
      animation: thinkingBlinkFast 0.8s infinite cubic-bezier(0.4, 0, 0.2, 1) !important;
      transform-origin: center;
    }

    /* スリープ状態（まぶたを閉じる） */
    .eyes-closed {
      transform: scaleY(0.08) !important;
      border-radius: 50% !important;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--theme-color); }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between select-none relative bg-slate-950 text-slate-100 overflow-hidden">

  <!-- オーディオ活性化用スタート画面 -->
  <div id="unlockOverlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950/95 backdrop-blur-md cursor-pointer transition-opacity duration-500">
    <div class="text-center p-8 max-w-md bg-slate-900/80 border border-slate-800 rounded-3xl shadow-2xl relative overflow-hidden">
      <div class="w-24 h-24 mx-auto mb-6 rounded-full border-2 border-cyan-400 flex items-center justify-center text-cyan-400 text-4xl shadow-[0_0_30px_rgba(0,240,255,0.3)] animate-pulse">
        <i class="fa-solid fa-power-off"></i>
      </div>
      <h1 class="text-3xl font-extrabold tracking-wider font-orbitron mb-2 bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">LOBBY AI</h1>
      <p class="text-sm text-slate-400 mb-6">タップまたはクリックしてマイク音声・スピーチエンジンを起動します。</p>
      <button class="w-full py-4 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-2xl shadow-lg transition duration-200 transform active:scale-95 flex items-center justify-center gap-2 text-lg">
        <i class="fa-solid fa-microphone"></i> 起動して会話をはじめる
      </button>
    </div>
  </div>

  <!-- ヘッダーバー -->
  <header class="w-full p-4 flex justify-between items-center z-20 bg-slate-900/40 backdrop-blur-md border-b border-slate-800/50">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full lobby-part"></div>
      <span class="font-orbitron font-bold text-xl tracking-widest text-slate-200">LOBBY</span>
      <span id="statusBadge" class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700">準備中</span>
    </div>

    <div class="flex items-center gap-2">
      <button id="spotifyBtn" title="Spotifyで音楽を再生" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-green-600/30 text-green-400 border border-slate-700/60 transition flex items-center gap-2 text-xs font-semibold">
        <i class="fa-brands fa-spotify text-lg"></i>
        <span class="hidden sm:inline">Spotify</span>
      </button>

      <button id="settingsToggleBtn" title="設定" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 transition">
        <i class="fa-solid fa-gear text-lg"></i>
      </button>
    </div>
  </header>

  <!-- メイン顔表示エリア（タップで発声中断） -->
  <main id="mainDisplay" class="flex-1 flex flex-col items-center justify-center relative w-full px-4 cursor-pointer select-none">
    
    <div class="absolute w-[350px] h-[350px] sm:w-[450px] sm:h-[450px] rounded-full bg-cyan-500/10 blur-[100px] pointer-events-none"></div>

    <div class="face-scalable-container flex flex-col items-center justify-center gap-12 sm:gap-16 z-10 my-auto">
      <div id="eyesContainer" class="flex justify-center items-center gap-12 sm:gap-20 transition-all duration-300">
        <div id="eyeLeft" class="eye-element relative flex items-center justify-center transition-all duration-200"></div>
        <div id="eyeRight" class="eye-element relative flex items-center justify-center transition-all duration-200"></div>
      </div>

      <div id="mouthContainer" class="flex justify-center items-center transition-all duration-100">
        <div id="mouthElement" class="mouth-element relative transition-all duration-100"></div>
      </div>
    </div>

    <!-- 中断ガイドメッセージ -->
    <div id="interactionHint" class="absolute top-6 text-xs text-slate-500 bg-slate-900/60 px-3 py-1.5 rounded-full border border-slate-800 pointer-events-none opacity-0 transition-opacity duration-300">
      <i class="fa-solid fa-hand text-cyan-400 mr-1"></i> 画面をタップするとおしゃべりを中断します
    </div>

    <!-- 強化型マイクインジケーター ＆ リアルタイム入力波形/音声感度メーター -->
    <div class="absolute bottom-6 flex flex-col items-center gap-3 z-10 pointer-events-none w-full max-w-xs px-4">
      
      <!-- 音声レベルインジケーター（マイクの入力感度をリアルタイム可視化） -->
      <div class="flex items-center gap-1 h-5 w-32 justify-center px-2 py-1 bg-slate-900/90 border border-slate-800 rounded-full shadow-inner">
        <div id="vuBar1" class="w-1.5 h-1.5 bg-cyan-500/30 rounded-full transition-all duration-75"></div>
        <div id="vuBar2" class="w-1.5 h-1.5 bg-cyan-500/30 rounded-full transition-all duration-75"></div>
        <div id="vuBar3" class="w-1.5 h-1.5 bg-cyan-500/30 rounded-full transition-all duration-75"></div>
        <div id="vuBar4" class="w-1.5 h-1.5 bg-cyan-500/30 rounded-full transition-all duration-75"></div>
        <div id="vuBar5" class="w-1.5 h-1.5 bg-cyan-500/30 rounded-full transition-all duration-75"></div>
      </div>

      <div id="micPulseRing" class="relative flex items-center justify-center">
        <button id="micStatusBtn" class="w-14 h-14 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center text-slate-400 shadow-xl transition-all duration-300 pointer-events-auto cursor-pointer" title="マイク状態 / クリックで手動再初期化">
          <i class="fa-solid fa-microphone text-xl" id="micIcon"></i>
        </button>
      </div>
      
      <span id="micStatusText" class="text-xs text-slate-400 font-medium px-3.5 py-1 rounded-full bg-slate-900/80 border border-slate-800 text-center shadow-lg">
        マイク準備中...
      </span>
    </div>
  </main>

  <!-- 設定パネル -->
  <div id="settingsPanel" class="fixed top-0 right-0 h-full w-full sm:w-96 bg-slate-900/95 backdrop-blur-xl border-l border-slate-800 z-40 transform translate-x-full transition-transform duration-300 ease-in-out p-6 overflow-y-auto flex flex-col justify-between">
    <div>
      <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
        <h2 class="text-lg font-bold font-orbitron text-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-sliders text-cyan-400"></i> LOBBY SETTINGS
        </h2>
        <button id="closeSettingsBtn" title="閉じる" class="w-10 h-10 rounded-full bg-slate-800 hover:bg-rose-500/20 hover:text-rose-400 text-slate-300 border border-slate-700 hover:border-rose-500/50 flex items-center justify-center transition-all duration-200 transform hover:scale-110 active:scale-95 shadow-md">
          <i class="fa-solid fa-xmark text-xl font-bold"></i>
        </button>
      </div>

      <div class="space-y-6 text-sm">
        <div>
          <label for="dialectSelect" class="block text-slate-400 font-medium mb-2">話し方・方言（デフォルト: 九州弁）</label>
          <select id="dialectSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-cyan-500">
            <option value="kyushu" selected>九州弁（デフォルト・博多・熊本など）</option>
            <option value="standard">標準語</option>
            <option value="kansai">関西弁</option>
            <option value="tohoku">東北弁</option>
          </select>
        </div>

        <div>
          <label for="voiceSelect" class="block text-slate-400 font-medium mb-2">ボイスタイプ（男性5種 / 女性5種）</label>
          <select id="voiceSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-cyan-500">
            <option value="female1" selected>女性 1（デフォルト・標準ピッチ / 女性らしい口調）</option>
            <option value="female2">女性 2（高め・明るい / 女性らしい口調）</option>
            <option value="female3">女性 3（低め・落ち着き / 女性らしい口調）</option>
            <option value="female4">女性 4（ソフト・キュート / 女性らしい口調）</option>
            <option value="female5">女性 5（クリア・知性 / 女性らしい口調）</option>
            <option value="male1">男性 1（標準ピッチ / 男性らしい口調）</option>
            <option value="male2">男性 2（低音・深み / 男性らしい口調）</option>
            <option value="male3">男性 3（ハキハキ・高め / 男性らしい口調）</option>
            <option value="male4">男性 4（ナレーション風 / 男性らしい口調）</option>
            <option value="male5">男性 5（エネルギッシュ / 男性らしい口調）</option>
          </select>
        </div>

        <div>
          <label for="mouthStyleSelect" class="block text-slate-400 font-medium mb-2">口のスタイル (Mouth Style)</label>
          <select id="mouthStyleSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-cyan-500">
            <option value="standard">1. STANDARD（スタンダード/カーブ）</option>
            <option value="pixel_line">2. PIXEL/LINE（直線/ミニマル）</option>
            <option value="oval">3. OVAL（楕円/スリム）</option>
            <option value="cyber_bar">4. CYBER BAR（横長バー）</option>
            <option value="smile">5. SMILE/BEAM（ワイドスマイル）</option>
          </select>
        </div>

        <div>
          <label class="block text-slate-400 font-medium mb-2">パーツサイズ</label>
          <div class="grid grid-cols-3 gap-2">
            <button class="size-btn py-2 bg-slate-800 rounded-xl border border-slate-700 text-xs font-semibold hover:border-cyan-500" data-scale="0.75">小 (75%)</button>
            <button class="size-btn py-2 bg-slate-800 rounded-xl border border-cyan-500 text-xs font-semibold text-cyan-400" data-scale="1.0">中 (100%)</button>
            <button class="size-btn py-2 bg-slate-800 rounded-xl border border-slate-700 text-xs font-semibold hover:border-cyan-500" data-scale="1.25">大 (125%)</button>
          </div>
        </div>

        <div>
          <label for="dialectSelect" class="block text-slate-400 font-medium mb-2">話し方・方言（デフォルト: 関西弁）</label>
          <select id="dialectSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-cyan-500">
            <option value="kansai" selected>関西弁（デフォルト）</option>
            <option value="standard">標準語</option>
            <option value="kyushu">九州弁</option>
            <option value="tohoku">東北弁</option>
          </select>
        </div>

        <div>
          <label for="voiceSelect" class="block text-slate-400 font-medium mb-2">ボイスタイプ（男性5種 / 女性5種）</label>
          <select id="voiceSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-cyan-500">
            <option value="female1" selected>女性 1（デフォルト・標準ピッチ）</option>
            <option value="female2">女性 2（高め・明るい）</option>
            <option value="female3">女性 3（低め・落ち着き）</option>
            <option value="female4">女性 4（ソフト・キュート）</option>
            <option value="female5">女性 5（クリア・知性）</option>
            <option value="male1">男性 1（標準ピッチ）</option>
            <option value="male2">男性 2（低音・深み）</option>
            <option value="male3">男性 3（ハキハキ・高め）</option>
            <option value="male4">男性 4（ナレーション風）</option>
            <option value="male5">男性 5（エネルギッシュ）</option>
          </select>
        </div>

        <div>
          <div class="flex justify-between text-slate-400 mb-1">
            <label for="rateRange" class="font-medium">話速 (Speed)</label>
            <span id="rateValue" class="font-orbitron text-cyan-400">1.0x</span>
          </div>
          <input type="range" id="rateRange" min="0.5" max="2.0" step="0.1" value="1.0" class="w-full accent-cyan-400 bg-slate-800 rounded-lg cursor-pointer">
        </div>

        <button id="resetHistoryBtn" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 rounded-xl border border-slate-700 text-xs transition">
          <i class="fa-solid fa-rotate-left mr-1"></i> 会話履歴（コンテキスト）をリセット
        </button>
      </div>
    </div>

    <div class="pt-6 border-t border-slate-800 text-center text-xs text-slate-500">
      Lobby AI Companion v2.8 (Audio Robust Edition)
    </div>
  </div>

  <script>
    // --- アプリケーション状態 ---
    const state = {
      themeColor: '#00f0ff',
      themeGlow: 'rgba(0, 240, 255, 0.4)',
      eyeStyle: 'classic',
      mouthStyle: 'standard',
      scale: 1.0,
      dialect: 'kyushu', // デフォルトを九州弁に設定
      voiceType: 'female1', // デフォルトを female1 に設定
      speedRate: 1.0,
      isListening: false,
      isSpeaking: false,
      isThinking: false,
      isSleeping: false,
      audioUnlocked: false,
      mouthAnimationInterval: null,
      sleepTimer: null,
      chatHistory: [], // 会話コンテキスト保持
      micStream: null,
      audioContext: null,
      analyser: null
    };

    // --- DOM要素 ---
    const unlockOverlay = document.getElementById('unlockOverlay');
    const settingsPanel = document.getElementById('settingsPanel');
    const settingsToggleBtn = document.getElementById('settingsToggleBtn');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const statusBadge = document.getElementById('statusBadge');
    const eyeLeft = document.getElementById('eyeLeft');
    const eyeRight = document.getElementById('eyeRight');
    const mouthElement = document.getElementById('mouthElement');
    const micStatusBtn = document.getElementById('micStatusBtn');
    const micIcon = document.getElementById('micIcon');
    const micStatusText = document.getElementById('micStatusText');
    const mainDisplay = document.getElementById('mainDisplay');
    const interactionHint = document.getElementById('interactionHint');
    const rateRange = document.getElementById('rateRange');
    const rateValue = document.getElementById('rateValue');
    const spotifyBtn = document.getElementById('spotifyBtn');
    const resetHistoryBtn = document.getElementById('resetHistoryBtn');

    // VU メーターエレメント
    const vuBars = [
      document.getElementById('vuBar1'),
      document.getElementById('vuBar2'),
      document.getElementById('vuBar3'),
      document.getElementById('vuBar4'),
      document.getElementById('vuBar5')
    ];

    // --- オーディオ活性化 ＆ マイク権限取得 ---
    async function unlockAudioContext() {
      if (state.audioUnlocked) return;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.resume();
        const dummyUtterance = new SpeechSynthesisUtterance('');
        dummyUtterance.volume = 0;
        dummyUtterance.rate = 10;
        window.speechSynthesis.speak(dummyUtterance);
      }

      state.audioUnlocked = true;
      unlockOverlay.style.opacity = '0';

      // リアルタイム音声入力メーター用の Web Audio API アナライザー初期化
      initAudioVisualizer();

      setTimeout(() => {
        unlockOverlay.style.display = 'none';
        setStatus('スタンバイ', 'bg-cyan-500/20 text-cyan-400 border-cyan-500/40');
        initSpeechRecognition(); // 音声認識をアクティブ化
      }, 500);
    }

    unlockOverlay.addEventListener('click', unlockAudioContext);

    // --- リアルタイムマイク入力メーター (Web Audio API) ---
    async function initAudioVisualizer() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        state.micStream = stream;
        
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        state.audioContext = new AudioContext();
        const source = state.audioContext.createMediaStreamSource(stream);
        state.analyser = state.audioContext.createAnalyser();
        state.analyser.fftSize = 64;
        source.connect(state.analyser);

        const dataArray = new Uint8Array(state.analyser.frequencyBinCount);

        function updateMeter() {
          if (state.analyser && state.isListening) {
            state.analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
              sum += dataArray[i];
            }
            const average = sum / dataArray.length; // 0 ~ 255
            const level = Math.min(5, Math.floor(average / 12));

            // インジケーターバーの点灯更新
            vuBars.forEach((bar, index) => {
              if (index < level) {
                bar.style.backgroundColor = state.themeColor;
                bar.style.height = `${(index + 1) * 3 + 4}px`;
                bar.style.opacity = '1';
              } else {
                bar.style.backgroundColor = 'rgba(6, 182, 212, 0.2)';
                bar.style.height = '6px';
                bar.style.opacity = '0.3';
              }
            });
          } else {
            vuBars.forEach(bar => {
              bar.style.backgroundColor = 'rgba(6, 182, 212, 0.2)';
              bar.style.height = '6px';
              bar.style.opacity = '0.3';
            });
          }
          requestAnimationFrame(updateMeter);
        }
        updateMeter();
      } catch (err) {
        console.warn("マイク入力アナライザーの初期化に失敗（標準マイク認識のみ利用）:", err);
      }
    }

    // --- 画面タップで話すの中断 ---
    mainDisplay.addEventListener('click', (e) => {
      if (e.target.closest('#settingsPanel') || e.target.closest('#settingsToggleBtn') || e.target.closest('#spotifyBtn') || e.target.closest('#micStatusBtn')) {
        return;
      }

      if (state.isSpeaking) {
        window.speechSynthesis.cancel();
        stopSpeakingState();
        setStatus('中断しました', 'bg-slate-800 text-slate-300 border-slate-700');
        setTimeout(() => {
          if (!state.isSpeaking && !state.isThinking) {
            setStatus('スタンバイ', 'bg-cyan-500/20 text-cyan-400 border-cyan-500/40');
          }
        }, 1200);
      }
    });

    // --- ステータス表示の更新 ---
    function setStatus(text, classes) {
      statusBadge.textContent = text;
      statusBadge.className = `text-xs px-2.5 py-1 rounded-full border ${classes}`;
    }

    // --- 顔パーツの描画処理 ---
    function renderFace() {
      let eyeHTML = '';
      switch (state.eyeStyle) {
        case 'dot':
          eyeHTML = `<div class="w-8 h-8 rounded-full lobby-part"></div>`;
          break;
        case 'almond':
          eyeHTML = `<div class="w-14 h-6 rounded-full lobby-part" style="transform: rotate(-10deg);"></div>`;
          break;
        case 'neon_ring':
          eyeHTML = `<div class="w-12 h-12 rounded-full border-4 lobby-part-border flex items-center justify-center">
                      <div class="w-4 h-4 rounded-full lobby-part"></div>
                     </div>`;
          break;
        case 'hexagon':
          eyeHTML = `<svg class="w-12 h-12 lobby-part-svg" viewBox="0 0 100 100">
                      <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" />
                     </svg>`;
          break;
        case 'classic':
        default:
          eyeHTML = `<div class="w-12 h-12 rounded-full lobby-part pulse-glow"></div>`;
          break;
      }

      eyeLeft.innerHTML = eyeHTML;
      eyeRight.innerHTML = eyeHTML;

      // 思考中（連続高速瞬き） vs スリープ（閉じ目） vs 通常
      if (state.isThinking) {
        eyeLeft.classList.add('thinking-eyes');
        eyeRight.classList.add('thinking-eyes');
        eyeLeft.classList.remove('eyes-closed');
        eyeRight.classList.remove('eyes-closed');
      } else if (state.isSleeping) {
        eyeLeft.classList.remove('thinking-eyes');
        eyeRight.classList.remove('thinking-eyes');
        eyeLeft.classList.add('eyes-closed');
        eyeRight.classList.add('eyes-closed');
      } else {
        eyeLeft.classList.remove('thinking-eyes', 'eyes-closed');
        eyeRight.classList.remove('thinking-eyes', 'eyes-closed');
      }

      renderMouthState(0.2);
    }

    function renderMouthState(openRatio = 0) {
      const minW = 40;
      const maxW = 70;
      const width = minW + (maxW - minW) * openRatio;
      const height = Math.max(6, 30 * openRatio);

      switch (state.mouthStyle) {
        case 'pixel_line':
          mouthElement.innerHTML = `<div class="lobby-part" style="width: ${width}px; height: ${Math.max(4, height)}px; border-radius: 2px;"></div>`;
          break;
        case 'oval':
          mouthElement.innerHTML = `<div class="lobby-part" style="width: ${width * 0.8}px; height: ${Math.max(8, height * 1.2)}px; border-radius: 50%;"></div>`;
          break;
        case 'cyber_bar':
          mouthElement.innerHTML = `<div class="lobby-part-border border-2 flex items-center justify-center p-0.5" style="width: ${width * 1.1}px; height: ${Math.max(10, height)}px; border-radius: 4px;">
                                      <div class="lobby-part w-full h-full"></div>
                                    </div>`;
          break;
        case 'smile':
          mouthElement.innerHTML = `<div class="lobby-part" style="width: ${width}px; height: ${Math.max(12, height * 1.4)}px; border-radius: 0 0 100px 100px;"></div>`;
          break;
        case 'standard':
        default:
          mouthElement.innerHTML = `<div class="lobby-part" style="width: ${width}px; height: ${Math.max(8, height)}px; border-radius: 20px;"></div>`;
          break;
      }
    }

    function setThemeColor(color, glow) {
      state.themeColor = color;
      state.themeGlow = glow;
      document.documentElement.style.setProperty('--theme-color', color);
      document.documentElement.style.setProperty('--theme-glow', glow);
      renderFace();
    }

    // --- TTS（音声合成）＆ 口パク連動 ---
    function speakResponse(text) {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = state.speedRate;

      const voices = window.speechSynthesis.getVoices().filter(v => v.lang.includes('ja') || v.lang.includes('JP'));
      if (voices.length > 0) utterance.voice = voices[0];

      switch (state.voiceType) {
        case 'female1': utterance.pitch = 1.2; break;
        case 'female2': utterance.pitch = 1.5; break;
        case 'female3': utterance.pitch = 0.9; break;
        case 'female4': utterance.pitch = 1.3; utterance.rate *= 0.95; break;
        case 'female5': utterance.pitch = 1.1; utterance.rate *= 1.05; break;
        case 'male1': utterance.pitch = 0.8; break;
        case 'male2': utterance.pitch = 0.5; break;
        case 'male3': utterance.pitch = 0.95; break;
        case 'male4': utterance.pitch = 0.7; utterance.rate *= 0.9; break;
        case 'male5': utterance.pitch = 0.85; utterance.rate *= 1.1; break;
      }

      utterance.onstart = () => {
        state.isSpeaking = true;
        state.isThinking = false; // 思考終了
        interactionHint.style.opacity = '1';
        wakeUp();
        setStatus('話しています...', 'bg-cyan-500/20 text-cyan-400 border-cyan-500/40');
        
        clearInterval(state.mouthAnimationInterval);
        state.mouthAnimationInterval = setInterval(() => {
          renderMouthState(Math.random());
        }, 120);

        const keepAliveInterval = setInterval(() => {
          if (!state.isSpeaking) {
            clearInterval(keepAliveInterval);
          } else {
            window.speechSynthesis.resume();
          }
        }, 3000);
      };

      utterance.onend = () => {
        stopSpeakingState();
      };

      utterance.onerror = () => {
        stopSpeakingState();
      };

      window.speechSynthesis.resume();
      window.speechSynthesis.speak(utterance);
    }

    function stopSpeakingState() {
      state.isSpeaking = false;
      state.isThinking = false;
      interactionHint.style.opacity = '0';
      clearInterval(state.mouthAnimationInterval);
      renderMouthState(0.2);
      renderFace();
      setStatus('スタンバイ', 'bg-cyan-500/20 text-cyan-400 border-cyan-500/40');
      resetSleepTimer();

      // 発声終了後、マイク待機状態を迅速に確認・再開
      setTimeout(() => {
        startRecognitionSafely();
      }, 400);
    }

    // --- Gemini API連携（会話履歴を維持するマルチターン対応） ---
    async function askLobby(userPrompt) {
      wakeUp();
      state.isThinking = true;
      renderFace(); // 考え中（目をパチパチ高速瞬きさせる）
      setStatus('考え中...', 'bg-amber-500/20 text-amber-400 border-amber-500/40');

      // 性別の判定 (female1~5 か male1~5 か)
      const isFemale = state.voiceType.startsWith('female');

      let dialectInstruction = "";

      if (state.dialect === 'kyushu') {
        if (isFemale) {
          dialectInstruction = "可愛らしく優しさ溢れる女性の九州弁（博多・熊本など）で話してください。「〜ばい」「〜たい」「〜と？」「〜ちゃ」「〜よね」などの自然でチャーミングな女性の語尾を使ってください。";
        } else {
          dialectInstruction = "頼もしく気さくな男性の九州弁（博多・熊本など）で話してください。「〜ばい」「〜たい」「〜ばってん」「〜ぞ」「〜たいね」などの男らしく親しみやすい語尾を使ってください。";
        }
      } else if (state.dialect === 'kansai') {
        if (isFemale) {
          dialectInstruction = "明るくチャーミングな女性の関西弁で話してください。「〜やで」「〜わ」「〜ねん」「〜はん」などの柔らかい女性の語尾を使ってください。";
        } else {
          dialectInstruction = "気さくでノリが良い男性の関西弁で話してください。「〜やで」「〜やんか」「〜で」「〜かいな」などの男らしい語尾を使ってください。";
        }
      } else if (state.dialect === 'tohoku') {
        if (isFemale) {
          dialectInstruction = "素朴で優しく可愛らしい女性の東北弁で話してください。「〜だっちゃ」「〜だべ」「〜な」などの柔らかい女性の語尾を使ってください。";
        } else {
          dialectInstruction = "温かみがあり朴訥とした男性の東北弁で話してください。「〜だべ」「〜だぞ」「〜だな」などの男らしい語尾を使ってください。";
        }
      } else { // standard（標準語）
        if (isFemale) {
          dialectInstruction = "丁寧で温かみのある女性らしい標準語で話してください。「〜だよ」「〜ね」「〜かしら」「〜なの」などの自然で優雅な女性の語尾を使ってください。";
        } else {
          dialectInstruction = "頼りがいがありハキハキとした男性らしい標準語で話してください。「〜だよ」「〜さ」「〜だな」「〜かい」などの自然で心地よい男性の語尾を使ってください。";
        }
      }

      const systemPrompt = `あなたはデスクトップAI相棒の「Lobby（ロビー）」です。
以下の指示に従ってください：
- 性格：フレンドリー、賢い、親しみやすい相棒。
- 話し方ルール: ${dialectInstruction}
- 回答の形式: 音声でそのまま朗読するため、マークダウン記号（*、#、- など）や絵文字は一切使用せず、自然で話し言葉の文章で回答を作成してください。
- 「しりとり」をする場合：前言った単語をしっかり覚えて、ルールを守って楽しんでください。「ん」で終わった単語が出たら負け判定を行い、新しい単語を求めてください。
- 短く会話が心地よくテンポ良く続くように会話してください。`;

      state.chatHistory.push({ role: 'user', parts: [{ text: userPrompt }] });
      const trimmedHistory = state.chatHistory.slice(-10);

      const apiKey = "";
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: trimmedHistory,
            systemInstruction: { parts: [{ text: systemPrompt }] }
          })
        });

        const data = await response.json();
        const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text;

        if (replyText) {
          state.chatHistory.push({ role: 'model', parts: [{ text: replyText }] });
          speakResponse(replyText);
        } else {
          state.isThinking = false;
          renderFace();
          const fallbackMsg = isFemale ? "ごめんね、うまく聞き取れんかったばい。もう一度教えてくれる？" : "すまん、うまく聞き取れんかったばい。もう一回言ってくれんか？";
          speakResponse(fallbackMsg);
        }
      } catch (error) {
        console.error("API Error:", error);
        state.isThinking = false;
        renderFace();
        const errorMsg = isFemale ? "ごめんね、通信エラーが起きてしもたみたいたい。" : "すまん、通信エラーが発生してしもたみたいたい。";
        speakResponse(errorMsg);
      }
    }

    // --- 音声認識の強化＆シームレス無音ループ（聞き取りの不具合を完全に解消） ---
    let recognition = null;
    let isRecognitionActive = false;
    let autoRestartTimer = null;

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        micStatusText.textContent = 'お使いのブラウザは音声認識に対応していません';
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isRecognitionActive = true;
        state.isListening = true;
        micStatusBtn.className = "w-14 h-14 rounded-full bg-cyan-500/20 border-2 border-cyan-400 text-cyan-400 shadow-[0_0_25px_rgba(0,240,255,0.6)] flex items-center justify-center animate-pulse pointer-events-auto cursor-pointer";
        micStatusText.textContent = "お声を聴いています（いつでも話しかけてください）";
        micStatusText.className = "text-xs text-cyan-300 font-medium px-3.5 py-1 rounded-full bg-cyan-950/80 border border-cyan-500/40 shadow-lg text-center";
      };

      recognition.onresult = (event) => {
        if (state.isSpeaking || state.isThinking) return;

        const lastIndex = event.results.length - 1;
        const transcript = event.results[lastIndex][0].transcript.trim();

        if (transcript.length > 0) {
          console.log("Recognized Speech:", transcript);
          askLobby(transcript);
        }
      };

      recognition.onerror = (event) => {
        console.warn("Speech recognition notice:", event.error);
        if (event.error === 'not-allowed') {
          micStatusText.textContent = "マイクの使用許可が必要です";
          micStatusText.className = "text-xs text-rose-400 font-medium px-3 py-1 rounded-full bg-rose-950/80 border border-rose-500/40";
          isRecognitionActive = false;
        }
      };

      recognition.onend = () => {
        isRecognitionActive = false;
        state.isListening = false;
        
        // 話し中・考え中でなければ常に即座に自動起動させて切れ目をなくす
        if (state.audioUnlocked && !state.isSpeaking && !state.isThinking) {
          clearTimeout(autoRestartTimer);
          autoRestartTimer = setTimeout(() => {
            startRecognitionSafely();
          }, 200);
        }
      };

      startRecognitionSafely();
    }

    function startRecognitionSafely() {
      if (!recognition || isRecognitionActive || state.isSpeaking || state.isThinking) return;
      try {
        recognition.start();
      } catch (e) {
        // すでに開始状態の場合などは再読み込み
        try {
          recognition.stop();
          setTimeout(() => recognition.start(), 150);
        } catch(err){}
      }
    }

    // 手動マイク再読み込み（ユーザーの任意リセット機能）
    micStatusBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!state.audioUnlocked) return;
      
      micStatusText.textContent = "マイクを再接続中...";
      try {
        if (recognition) recognition.stop();
      } catch(err){}

      setTimeout(() => {
        startRecognitionSafely();
      }, 300);
    });

    // --- スリープ＆ウェイク ---
    function wakeUp() {
      state.isSleeping = false;
      renderFace();
      resetSleepTimer();
    }

    function goToSleep() {
      if (state.isSpeaking || state.isThinking) return;
      state.isSleeping = true;
      renderFace();
      setStatus('スリープ中', 'bg-slate-800 text-slate-500 border-slate-700');
    }

    function resetSleepTimer() {
      clearTimeout(state.sleepTimer);
      state.sleepTimer = setTimeout(() => {
        goToSleep();
      }, 40000);
    }

    // --- Spotify ---
    spotifyBtn.addEventListener('click', () => {
      wakeUp();
      const spotifyPlaylists = [
        'https://open.spotify.com/genre/0JQ5DAqbMKFEC4WF2R211M',
        'https://open.spotify.com/genre/0JQ5DAqbMKFAUsA3PJR62a',
        'https://open.spotify.com/genre/0JQ5DAqbMKFz23s222Kh2y'
      ];
      const randomUrl = spotifyPlaylists[Math.floor(Math.random() * spotifyPlaylists.length)];
      speakResponse("Spotifyを開いて音楽を再生するで！リラックスして聞いてな。");
      setTimeout(() => { window.open(randomUrl, '_blank'); }, 1500);
    });

    // --- UIイベントハンドラー ---
    settingsToggleBtn.addEventListener('click', () => {
      settingsPanel.classList.remove('translate-x-full');
    });

    closeSettingsBtn.addEventListener('click', () => {
      settingsPanel.classList.add('translate-x-full');
    });

    document.querySelectorAll('.color-picker-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.color-picker-btn').forEach(b => b.classList.remove('ring-2', 'ring-white/50'));
        e.currentTarget.classList.add('ring-2', 'ring-white/50');
        setThemeColor(e.currentTarget.dataset.color, e.currentTarget.dataset.glow);
      });
    });

    document.getElementById('eyeStyleSelect').addEventListener('change', (e) => {
      state.eyeStyle = e.target.value;
      renderFace();
    });

    document.getElementById('mouthStyleSelect').addEventListener('change', (e) => {
      state.mouthStyle = e.target.value;
      renderFace();
    });

    document.querySelectorAll('.size-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.size-btn').forEach(b => {
          b.classList.remove('border-cyan-500', 'text-cyan-400');
          b.classList.add('border-slate-700', 'text-slate-200');
        });
        e.currentTarget.classList.remove('border-slate-700', 'text-slate-200');
        e.currentTarget.classList.add('border-cyan-500', 'text-cyan-400');

        state.scale = parseFloat(e.currentTarget.dataset.scale);
        document.documentElement.style.setProperty('--part-scale', state.scale);
      });
    });

    document.getElementById('dialectSelect').addEventListener('change', (e) => {
      state.dialect = e.target.value;
    });

    document.getElementById('voiceSelect').addEventListener('change', (e) => {
      state.voiceType = e.target.value;
    });

    rateRange.addEventListener('input', (e) => {
      state.speedRate = parseFloat(e.target.value);
      rateValue.textContent = `${state.speedRate.toFixed(1)}x`;
    });

    resetHistoryBtn.addEventListener('click', () => {
      state.chatHistory = [];
      speakResponse("これまでの会話をリセットしたよ！新しいお話をはじめよう。");
    });

    // --- 初期化 ---
    window.addEventListener('DOMContentLoaded', () => {
      renderFace();
      resetSleepTimer();

      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }
    });
  </script>
</body>
</html>
